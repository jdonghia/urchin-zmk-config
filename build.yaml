# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # No physical nice_view displays installed — shields removed
  # from the build to avoid unused display drivers being compiled in.
  - board: nice_nano_v2
    shield: urchin_left
  - board: nice_nano_v2
    shield: urchin_right
  - board: nice_nano_v2
    shield: settings_reset
