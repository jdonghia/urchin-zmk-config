# enable bluetooth
CONFIG_BT=y

# Lower TX power to -8 dBm to reduce radio current. The halves
# sit a few cm apart and the host is usually within a meter, so
# -8 dBm is plenty. Step back up to -4 (or 0) if you see
# disconnects between halves or to the host.
CONFIG_BT_CTLR_TX_PWR_MINUS_8=y
# CONFIG_BT_CTLR_TX_PWR_MINUS_4=y
# Do NOT enable +8 dBm unless you have real range issues —
# it roughly doubles radio current draw.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# enable deep sleep support
CONFIG_ZMK_SLEEP=y

# the keyboard disconnects from bluetooth when idle.
# uses very little power, but it may take
# a few seconds to reconnect after waking.
# 600.000 ms = 10 minutes (shortened from 20 min to cut
# idle-connected drain when stepping away from the keyboard).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# "Eager Debouncing"
# Trying to lower the input lag.
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- DISPLAY SETTINGS ---
# No physical display installed on either half. Display shields
# have been removed from build.yaml; these flags are kept as a
# defensive safety net in case the shields are ever re-added.
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=n
CONFIG_NICE_VIEW_GEM_ANIMATION=n

# Don't fetch peripheral battery level — this wakes the central
# radio periodically and shortens central battery life.
# Tradeoff: host won't see the right-hand battery percentage.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# Battery reporting disabled entirely — skips the GATT plumbing
# as well as periodic ADC reads. Tradeoff: host no longer shows
# a battery % indicator for the keyboard. Re-enable (and set
# CONFIG_ZMK_BATTERY_REPORT_INTERVAL=43200) if you want it back.
CONFIG_ZMK_BATTERY_REPORTING=n
# CONFIG_ZMK_BATTERY_REPORT_INTERVAL=43200

# Allow soft-off via key combo.
CONFIG_ZMK_PM_SOFT_OFF=y

# --- BLE CONNECTION PARAMETERS ---
# Connection interval is negotiated with the host. Longer interval
# and higher peripheral latency let the radio skip empty connection
# events when there's no input, which is the dominant power cost
# while the keyboard is "idle but connected".
#
# MIN/MAX_INT are in units of 1.25 ms:
#   6  = 7.5 ms  (min interval)
#   12 = 15 ms   (max interval)
# LATENCY=30 lets the peripheral skip up to 30 empty events between
# required wake-ups. Imperceptible for typing; large power win.
# TIMEOUT is in 10 ms units; 400 = 4 s supervision timeout.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --- DEFENSIVE: ensure nothing pulls in logging / USB serial ---
# Defaults are already off in ZMK, but being explicit prevents a
# transitive dependency (e.g. a future module) from quietly turning
# them back on and adding background current draw.
CONFIG_ZMK_USB_LOGGING=n
CONFIG_USB_CDC_ACM=n
CONFIG_SHELL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
